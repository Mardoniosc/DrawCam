<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0b0b0d">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Traçar — desenhe pela câmera</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon.svg">
<link rel="stylesheet" href="styles.css">
</head>
<body class="no-image">

  <video id="cam" playsinline autoplay muted disablepictureinpicture></video>

  <div id="stage">
    <div id="obj" hidden>
      <img id="overlay" alt="">
      <canvas id="art"></canvas>
      <div id="grid"></div>
    </div>
  </div>

  <div id="hint">
    <div class="hint-card">
      <h1>Traçar</h1>
      <p>Aponte a câmera para o papel, carregue uma imagem e copie os traços pela tela.</p>
      <div class="hint-actions">
        <button class="primary" data-act="pick">Carregar imagem</button>
        <button data-act="shot">Tirar foto</button>
      </div>
    </div>
  </div>

  <div id="cam-error" hidden>
    <div class="hint-card">
      <h2>Câmera indisponível</h2>
      <p id="cam-error-msg"></p>
      <button class="primary" data-act="retry">Tentar de novo</button>
    </div>
  </div>

  <!-- controles -->
  <div id="ui">
    <div id="bar-top">
      <button class="icon" data-act="hide" title="Esconder controles" aria-label="Esconder controles">
        <svg viewBox="0 0 24 24"><path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg>
      </button>
      <button class="icon" data-act="fit" title="Ajustar" aria-label="Ajustar imagem à tela">
        <svg viewBox="0 0 24 24"><path d="M15 3h6v6M9 21H3v-6M21 3l-7 7M3 21l7-7"/></svg>
      </button>
      <button class="icon" data-act="flip" title="Espelhar" aria-label="Espelhar horizontalmente">
        <svg viewBox="0 0 24 24"><path d="M12 3v18"/><path d="M9 7L3 12l6 5V7z"/><path d="M15 7l6 5-6 5V7z"/></svg>
      </button>
      <button class="icon" data-act="grid" title="Grade" aria-label="Alternar grade">
        <svg viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="1"/><path d="M9 3v18M15 3v18M3 9h18M3 15h18"/></svg>
      </button>
      <button class="icon" data-act="cam" title="Trocar câmera" aria-label="Trocar câmera">
        <svg viewBox="0 0 24 24"><path d="M20 7h-3l-2-2H9L7 7H4a2 2 0 00-2 2v9a2 2 0 002 2h16a2 2 0 002-2V9a2 2 0 00-2-2z"/><circle cx="12" cy="13" r="3.5"/></svg>
      </button>
      <button class="icon" data-act="full" title="Tela cheia" aria-label="Tela cheia">
        <svg viewBox="0 0 24 24"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg>
      </button>
    </div>

    <div id="bar-bottom">
      <div class="row slider-row" id="threshold-row">
        <svg class="mini" viewBox="0 0 24 24"><path d="M4 18c4-10 12-10 16 0" fill="none"/><path d="M4 21h16" fill="none"/></svg>
        <input id="threshold" type="range" min="0" max="100" value="30" aria-label="Limiar de detecção de bordas">
        <span id="threshold-val">30</span>
      </div>
      <div class="row slider-row">
        <svg class="mini" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 3a9 9 0 010 18z" fill="currentColor" stroke="none"/></svg>
        <input id="opacity" type="range" min="5" max="100" value="50" aria-label="Opacidade da imagem">
        <span id="opacity-val">50%</span>
      </div>
      <div class="row">
        <button data-act="pick">
          <svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="14" rx="2"/><circle cx="8.5" cy="10" r="1.5"/><path d="M21 15l-5-5L5 19"/></svg>
          <span>Imagem</span>
        </button>
        <button data-act="shot">
          <svg viewBox="0 0 24 24"><path d="M20 7h-3l-2-2H9L7 7H4a2 2 0 00-2 2v9a2 2 0 002 2h16a2 2 0 002-2V9a2 2 0 00-2-2z"/><circle cx="12" cy="13" r="3.5"/></svg>
          <span>Foto</span>
        </button>
        <button data-act="art" id="btn-art">
          <svg viewBox="0 0 24 24"><path d="M3 20c3-1 4-3.5 6.5-6S15 8 18 5"/><path d="M14 4.5L19.5 10"/><path d="M3 20l1.2-3.4L6.4 18.8z" fill="currentColor" stroke="none"/></svg>
          <span>Contorno</span>
        </button>
        <button data-act="lock" id="btn-lock" class="accent">
          <svg class="i-open" viewBox="0 0 24 24"><rect x="4" y="11" width="16" height="10" rx="2"/><path d="M8 11V7a4 4 0 018 0"/></svg>
          <svg class="i-closed" viewBox="0 0 24 24"><rect x="4" y="11" width="16" height="10" rx="2"/><path d="M8 11V7a4 4 0 118 0v4"/></svg>
          <span class="lock-label">Travar</span>
        </button>
      </div>
    </div>
  </div>

  <button id="peek" data-act="hide" aria-label="Mostrar controles">
    <svg viewBox="0 0 24 24"><path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg>
  </button>

  <div id="toast" role="status" aria-live="polite"></div>

  <input id="file-pick" type="file" accept="image/*" hidden>
  <input id="file-shot" type="file" accept="image/*" capture="environment" hidden>

  <script src="app.js"></script>
</body>
</html>
